name: Deploy Workation Frontend

on:
  push:
    branches: [deploy]

concurrency:
  group: workation-frontend-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Copy dist to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          source: dist/*
          target: /home/ubuntu/workation-frontend-upload
          strip_components: 1

      - name: Deploy frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            sudo mkdir -p /var/www/workation
            sudo rm -rf /var/www/workation/*
            sudo cp -r /home/ubuntu/workation-frontend-upload/* /var/www/workation/
            rm -rf /home/ubuntu/workation-frontend-upload/*
            sudo systemctl reload nginx